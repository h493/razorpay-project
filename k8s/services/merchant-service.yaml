apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: razorpay-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
    spec:
      initContainers:
        # config-service must be up first, otherwise the app fails to import its config and crash-loops
        - name: wait-for-config-service
          image: busybox:1.37
          command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://config-service:8888/actuator/health; do echo waiting for config-service; sleep 3; done"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: merchant-service
          image: himanshuchhikara21/razorpay-merchant-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9010
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: WEBHOOK_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: WEBHOOK_SECRET_ENCRYPTION_KEY
            - name: MERCHANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MERCHANT_DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9010
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: razorpay-core
spec:
  selector:
    app: merchant-service
  ports:
    - port: 80
      targetPort: 9010
