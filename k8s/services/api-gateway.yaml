apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: razorpay-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        # config-service must be up first, otherwise the app fails to import its config and crash-loops
        - name: wait-for-config-service
          image: busybox:1.37
          command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://config-service:8888/actuator/health; do echo waiting for config-service; sleep 3; done"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: api-gateway
          image: himanshuchhikara21/razorpay-api-gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: razorpay-core
spec:
  # GKE provisions an external Google Cloud load balancer; Postman/JMeter hit http://<EXTERNAL-IP>/
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
